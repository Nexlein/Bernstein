name: CI Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A read-only GitHub token for every job, whatever the repository setting; the 2 jobs that log in
# to Azure add id-token themselves. Third-party actions are pinned by commit SHA (ADR 0036).
permissions:
  contents: read

jobs:
  format-and-lint:
    name: Code Style & Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Root Tooling
        run: npm ci

      - name: Verify Code Formatting
        run: npm run format:check

      - name: Verify Code Map Freshness
        run: |
          node scripts/codemap.mjs
          git diff --exit-code .claude/codemap.md || (echo "ERROR: .claude/codemap.md is outdated. Run 'npm run codemap' and commit the changes." && exit 1)

      - name: Lint Shell Scripts
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Verify K8s Schema Copy
        run: |
          diff poll-application/schema.sql k8s/schema.sql || (echo "ERROR: k8s/schema.sql differs from poll-application/schema.sql. Copy it again: cp poll-application/schema.sql k8s/schema.sql" && exit 1)

      # Builds the manifests the way `kubectl apply -k k8s/` would, with the empty template as secrets.env.
      - name: Validate K8s Manifests (kustomize build)
        run: |
          cp k8s/secrets.env.example k8s/secrets.env
          kubectl kustomize k8s/ > /dev/null

      # Every rendered object against the Kubernetes JSON schema, unknown fields refused (ADR 0029):
      # our AKS version, and 1.31, the minimum DEPLOY.md asks for. Pinned release, checksum verified.
      - name: Validate K8s Manifests (kubeconform schema)
        shell: bash
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          for version in 1.36.4 1.31.0; do
            kubectl kustomize k8s/ | /tmp/kubeconform -strict -summary -kubernetes-version "$version" -
          done

  build-microservices:
    name: Build Container Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: poll
            context: ./poll-application/poll
          - service: worker
            context: ./poll-application/worker
          - service: result
            context: ./poll-application/result
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.service }} Container Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: false
          tags: bernstein-${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    name: Full Stack Integration & Probe Verification
    needs: [format-and-lint, build-microservices]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Full Stack with Docker Compose
        run: docker compose up -d --wait --build

      - name: Verify Poll Health & Readiness Probes
        run: |
          echo "Testing Poll /healthz..."
          curl --fail --retry 5 --retry-delay 2 http://localhost:5000/healthz
          echo -e "\nTesting Poll /readyz..."
          curl --fail --retry 5 --retry-delay 2 http://localhost:5000/readyz

      - name: Verify Result Health & Readiness Probes
        run: |
          echo "Testing Result /healthz..."
          curl --fail --retry 5 --retry-delay 2 http://localhost:5001/healthz
          echo -e "\nTesting Result /readyz..."
          curl --fail --retry 5 --retry-delay 2 http://localhost:5001/readyz

      - name: Cast Vote and Verify End-to-End Pipeline
        run: |
          echo "Submitting vote 'a' to Poll..."
          curl -f -X POST -d "vote=a" http://localhost:5000/
          echo "Waiting for Worker to persist the vote..."
          for i in $(seq 1 15); do
            VOTES_COUNT=$(docker compose exec -T postgres psql -U postgres -d postgres -t -c "SELECT COUNT(*) FROM votes;" | tr -d '[:space:]')
            [ "$VOTES_COUNT" -ge 1 ] && echo "Vote verified in PostgreSQL!" && exit 0
            sleep 2
          done
          echo "ERROR: Vote was not persisted into PostgreSQL!"
          docker compose logs worker
          exit 1

      - name: Cleanup Compose Stack
        if: always()
        run: docker compose down -v

  # Our own rules (CLAUDE.md, ADR 0030) on the rendered manifests: resources, non-root, rollout
  # strategy, 2+ pods for Poll and Result, probes, preStop, PDBs, which Services are public.
  baseline-rules:
    name: K8s Baseline Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # yq ships with the runner image; the script needs only Node.
      - name: Check the Baseline Rules
        shell: bash
        run: |
          cp k8s/secrets.env.example k8s/secrets.env
          kubectl kustomize k8s/ | yq ea -o=json '[.]' | node scripts/check-baseline.mjs

  # Deploys k8s/ on a throwaway Kubernetes 1.36.4 cluster (kind) and casts a vote end to end:
  # proves the manifests run, not only that they are valid (ADR 0031). The cluster lives as long
  # as the job, on the runner.
  kind-e2e:
    name: K8s on kind (deploy and vote)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The same 3 images as the build job, kept in the local Docker for kind.
      - name: Build poll
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./poll-application/poll
          load: true
          tags: poll:ci
          cache-from: type=gha
      - name: Build worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./poll-application/worker
          load: true
          tags: worker:ci
          cache-from: type=gha
      - name: Build result
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./poll-application/result
          load: true
          tags: result:ci
          cache-from: type=gha

      - name: Create the kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          config: tests/kind.yaml
          cluster_name: bernstein

      # The overlay scripts/deploy.sh would generate, with the loaded images instead of a registry.
      # A tag other than latest, so the nodes use the loaded image and pull nothing.
      - name: Deploy k8s/
        run: |
          kind load docker-image poll:ci worker:ci result:ci --name bernstein
          mkdir -p .deploy
          cat > .deploy/kustomization.yaml <<'EOF'
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../k8s
          images:
            - { name: poll, newTag: ci }
            - { name: worker, newTag: ci }
            - { name: result, newTag: ci }
          EOF
          # Throwaway passwords: the cluster is deleted with the runner.
          printf 'POSTGRES_PASSWORD=%s\nRESULT_DB_PASSWORD=%s\nWORKER_DB_PASSWORD=%s\nREDIS_PASSWORD=\n' \
            "$(openssl rand -hex 16)" "$(openssl rand -hex 16)" "$(openssl rand -hex 16)" > k8s/secrets.env
          kubectl apply -k .deploy

      - name: Wait for every workload
        run: |
          for resource in statefulset/postgres deployment/redis deployment/worker deployment/poll deployment/result; do
            kubectl -n bernstein rollout status --timeout=240s "$resource"
          done
          kubectl -n bernstein get pods -o wide

      # kind has no cloud load balancer: reach the Services through kubectl port-forward.
      - name: Vote through Poll and find it in PostgreSQL
        run: |
          kubectl -n bernstein port-forward svc/poll 8080:80 >/dev/null &
          kubectl -n bernstein port-forward svc/result 8081:80 >/dev/null &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null -X POST -d vote=a http://localhost:8080/
          for i in $(seq 1 30); do
            votes=$(kubectl -n bernstein exec postgres-0 -- psql -U postgres -d postgres -tAc 'SELECT count(*) FROM votes')
            [ "$votes" -ge 1 ] && break
            sleep 2
          done
          echo "Votes in PostgreSQL: $votes"
          [ "$votes" -ge 1 ]
          # Result is ready only when its read-only user reaches PostgreSQL.
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8081/readyz
          curl -fsS -o /dev/null http://localhost:8081/

      # The graded test (ADR 0016), from a pod in the cluster: a port-forward reaches a single pod,
      # the very pod a rollout replaces.
      - name: Zero downtime during a rollout of Poll and Result
        run: |
          tests/zero-downtime.sh --from cluster -- sh -c 'kubectl -n bernstein rollout restart deploy/poll deploy/result &&
            kubectl -n bernstein rollout status deploy/poll && kubectl -n bernstein rollout status deploy/result'

      # Evicts through the PodDisruptionBudgets. Not the node of postgres-0: on kind its volume is a
      # directory of that node, so the pod could not move (ADR 0031). --pod-selector: only our pods,
      # as kind's CoreDNS has no PodDisruptionBudget and the test's own pod has no controller.
      - name: Zero downtime during a drain of a worker
        run: |
          db_node=$(kubectl -n bernstein get pod postgres-0 -o jsonpath='{.spec.nodeName}')
          node=$(kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o jsonpath='{.items[*].metadata.name}' |
            tr ' ' '\n' | grep -vx "$db_node" | head -1)
          echo "Draining $node (PostgreSQL runs on $db_node)."
          kubectl -n bernstein get pods -o wide
          tests/zero-downtime.sh --from cluster -- kubectl drain "$node" --ignore-daemonsets --delete-emptydir-data \
            --timeout=180s --pod-selector 'app.kubernetes.io/name in (poll,result,redis,worker)'
          kubectl -n bernstein get pods -o wide
          kubectl uncordon "$node"

      - name: Show the cluster state on failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl -n bernstein get pods,svc,pvc -o wide || true
          kubectl -n bernstein describe pods || true
          for app in redis worker poll result; do kubectl -n bernstein logs "deploy/$app" --tail=40 || true; done
          kubectl -n bernstein logs postgres-0 --tail=40 || true
          kubectl -n bernstein get events --sort-by=.lastTimestamp | tail -40 || true

  # Logs in to our private registry without a stored password (ADR 0032): GitHub gives the job a
  # short-lived OIDC token, which Entra ID trusts through a federated credential of our CI app
  # (role AcrPush on the registry). Only in this repository, on a push or a PR from one of its
  # branches: the Epitech mirror, forks and fork PRs have neither the secrets nor the token.
  registry-login:
    name: Registry Login (Azure OIDC)
    if: >-
      github.repository == 'Nexlein/Bernstein' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the Azure secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
        shell: bash
        run: |
          missing=""
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s):$missing. How to set them: doc/setup/cluster-setup.md, section 8."
            exit 1
          fi

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Docker login to <name>.azurecr.io with an Entra token, valid about 3 hours.
      - name: Log in to the registry
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

  # Known vulnerabilities in the 5 images we run (ADR 0033): the 3 we build, and PostgreSQL and
  # Redis at the digests k8s/ pins. Fails only on a CRITICAL one that has a fix and is not
  # accepted in .trivyignore.yaml; the others go to the job summary. The Trivy binary, pinned and
  # checksum verified, not its GitHub Action, whose tags were hijacked in March 2026.
  image-scan:
    name: Image Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The same 3 images as the build job, kept in the local Docker for Trivy.
      - name: Build poll
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./poll-application/poll
          load: true
          tags: poll:scan
          cache-from: type=gha
      - name: Build worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./poll-application/worker
          load: true
          tags: worker:scan
          cache-from: type=gha
      - name: Build result
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./poll-application/result
          load: true
          tags: result:scan
          cache-from: type=gha

      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          curl -sSLo /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          /tmp/trivy --version

      # One scan per image (HIGH and CRITICAL); jq counts them for the summary and lists the
      # CRITICAL ones with a fixed version as errors, which fail the job.
      - name: Scan the images
        shell: bash
        run: |
          images=(poll:scan worker:scan result:scan)
          mapfile -t -O 3 images < <(grep -ho 'image: [^ ]*@sha256:[0-9a-f]*' k8s/*.yaml | cut -d' ' -f2 | sort -u)
          {
            echo "## Known vulnerabilities"
            echo
            echo "The job fails on a CRITICAL vulnerability that has a fixed version; the others are only reported (ADR 0033)."
            echo "Accepted ones, each with its reason, are left out: \`.trivyignore.yaml\`."
            echo
            echo "| Image | CRITICAL, fix available | CRITICAL, no fix | HIGH |"
            echo "| ----- | ----------------------: | ---------------: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          fixable=0
          for image in "${images[@]}"; do
            name=${image%@*}
            # 15 min: the first jar scan downloads Trivy's Java database (about 1.5 GB).
            /tmp/trivy image --quiet --timeout 15m --scanners vuln --severity HIGH,CRITICAL \
              --ignorefile .trivyignore.yaml --format json -o /tmp/scan.json "$image"
            jq -r --arg name "$name" '[.Results[]?.Vulnerabilities[]?] |
              "| `\($name)` | \(map(select(.Severity == "CRITICAL" and (.FixedVersion // "") != "")) | length)" +
              " | \(map(select(.Severity == "CRITICAL" and (.FixedVersion // "") == "")) | length)" +
              " | \(map(select(.Severity == "HIGH")) | length) |"' /tmp/scan.json >> "$GITHUB_STEP_SUMMARY"
            if jq -e '[.Results[]?.Vulnerabilities[]?] | length > 0' /tmp/scan.json > /dev/null; then
              {
                echo "<details><summary><code>$name</code></summary>"
                echo
                echo "| Severity | Package | Vulnerability | Installed | Fixed in |"
                echo "| -------- | ------- | ------------- | --------- | -------- |"
                jq -r '.Results[]?.Vulnerabilities[]? |
                  "| \(.Severity) | \(.PkgName) | \(.VulnerabilityID) | \(.InstalledVersion) | \(.FixedVersion // "") |"' /tmp/scan.json
                echo
                echo "</details>"
              } >> /tmp/details.md
            fi
            errors=$(jq -r --arg name "$name" '.Results[]?.Vulnerabilities[]? |
              select(.Severity == "CRITICAL" and (.FixedVersion // "") != "") |
              "::error::\($name): \(.VulnerabilityID) in \(.PkgName) \(.InstalledVersion), fixed in \(.FixedVersion)"' /tmp/scan.json)
            if [ -n "$errors" ]; then
              echo "$errors"
              fixable=$((fixable + $(grep -c . <<< "$errors")))
            fi
          done
          [ ! -f /tmp/details.md ] || { echo; cat /tmp/details.md; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$fixable" -gt 0 ]; then
            echo "::error::$fixable CRITICAL vulnerabilities have a fix: update the base image or the dependency."
            exit 1
          fi

  # Pushes main's images to our registry (ADR 0034), with the tags scripts/deploy.sh deploys: an
  # app gets a new image only when its code changed. After the tests, so only code that passed
  # them on main is published. On a push to main, in this repository only.
  publish:
    name: Publish Images (main)
    if: github.event_name == 'push' && github.repository == 'Nexlein/Bernstein'
    needs: [registry-login, integration-test, kind-e2e, image-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # The full history: each app's tag is the last commit that changed its folder.
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the new images
        env:
          REGISTRY: ${{ secrets.ACR_NAME }}.azurecr.io
        run: scripts/deploy.sh --push-only
