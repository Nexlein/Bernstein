# ==============================================================================
# Bernstein — Kubernetes Secrets Template (DO NOT COMMIT ACTUAL SECRETS)
#
# Instructions:
# 1. Copy this file to a safe local file (e.g., secret.yaml):
#      cp secret.example.yaml secret.yaml
# 2. Fill in the actual secret values.
# 3. Apply it to your Kubernetes cluster:
#      kubectl apply -f secret.yaml
#
# Note: secret.yaml is listed in .gitignore and will never be committed.
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  labels:
    app.kubernetes.io/part-of: bernstein
type: Opaque
stringData:
  POSTGRES_PASSWORD: 'replace_with_your_postgres_password'
  REDIS_PASSWORD: ''

---
# (Optional) Image Pull Secret for your Private Container Registry
# You can also generate this with:
#   kubectl create secret docker-registry registry-secret \
#     --docker-server=<YOUR_REGISTRY_URL> \
#     --docker-username=<YOUR_USERNAME> \
#     --docker-password=<YOUR_PASSWORD> \
#     --dry-run=client -o yaml > registry-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: registry-secret
  labels:
    app.kubernetes.io/part-of: bernstein
type: kubernetes.io/dockerconfigjson
data:
  # Base64 encoded .dockerconfigjson
  .dockerconfigjson: ''
