# PostgreSQL: one replica, data on a persistent disk, reachable only inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      # None of our pods calls the Kubernetes API: no service account token in the containers.
      automountServiceAccountToken: false
      securityContext:
        # Required by the "restricted" Pod Security Standard (namespace.yaml): the runtime's default syscall filter.
        seccompProfile:
          type: RuntimeDefault
        # uid/gid of the "postgres" user in postgres:*-alpine; fsGroup makes the disk writable for it.
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true
        fsGroup: 70
      containers:
        - name: postgres
          # PostgreSQL 18.6, pinned by digest: a new node pulls this exact image. Dependabot proposes
          # minor updates only: a major one (19) needs pg_upgrade of the data, not a new tag.
          image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            # Passwords of the app users, set by users.sh (first start, and every deploy).
            - name: RESULT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RESULT_DB_PASSWORD
            - name: WORKER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: WORKER_DB_PASSWORD
          readinessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            # The image keeps PGDATA in the 18/docker subdirectory of this mount.
            - name: data
              mountPath: /var/lib/postgresql
            # Scripts here run once, when the data dir is empty (first start).
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            # Read-only root filesystem: PostgreSQL writes its socket and lock file here, and temp files in /tmp.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 1Gi
