# Entry point: kubectl apply -k k8s/  (preview: kubectl kustomize k8s/)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every namespaced resource below lands in this namespace.
namespace: bernstein

# Added to metadata only; selectors are left untouched.
labels:
  - pairs:
      app.kubernetes.io/part-of: bernstein

resources:
  - namespace.yaml

# Non-secret settings shared by poll, worker, result and postgres.
# Kustomize appends a content hash to the name and rewrites references,
# so changing a value rolls the Deployments that use it.
configMapGenerator:
  - name: app-config
    literals:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
