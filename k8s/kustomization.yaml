# Entry point: kubectl apply -k k8s/  (preview: kubectl kustomize k8s/)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every namespaced resource below lands in this namespace.
namespace: bernstein

# Added to metadata only; selectors are left untouched.
labels:
  - pairs:
      app.kubernetes.io/part-of: bernstein

resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - result.yaml
  - worker.yaml
  - poll.yaml

# Real registry and tag of the app images (manifests use the bare name).
# CI sets newTag to the git SHA; an evaluator sets newName to their own registry.
images:
  - name: result
    newName: bernsteinacrmaeva.azurecr.io/result
    newTag: f880145
  - name: worker
    newName: bernsteinacrmaeva.azurecr.io/worker
    newTag: f880145
  - name: poll
    newName: bernsteinacrmaeva.azurecr.io/poll
    newTag: f880145

# Non-secret settings shared by poll, worker, result and postgres.
# Kustomize appends a content hash to the name and rewrites references,
# so changing a value rolls the Deployments that use it.
configMapGenerator:
  - name: app-config
    literals:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
  # schema.sql, run by the postgres image on its first start (empty data dir only).
  # Copy of poll-application/schema.sql: Kustomize cannot read files outside k8s/; CI checks they match.
  - name: postgres-init
    files:
      - schema.sql

# Passwords, read from the gitignored secrets.env (template: secrets.env.example).
# Same hash suffix as above: changing a password rolls the Deployments.
# Build fails if secrets.env is missing, so nothing deploys without secrets.
secretGenerator:
  - name: app-secrets
    envs:
      - secrets.env
