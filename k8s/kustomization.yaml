# Base of the deployment: scripts/deploy.sh applies it through .deploy/ (preview: kubectl kustomize k8s/)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every namespaced resource below lands in this namespace.
namespace: bernstein

# Added to metadata only; selectors are left untouched.
labels:
  - pairs:
      app.kubernetes.io/part-of: bernstein

resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - result.yaml
  - worker.yaml
  - poll.yaml
  - pdb.yaml
  - hpa.yaml
  - network-policies.yaml

# No registry or tag here: the manifests use the bare image names (poll, worker, result),
# and scripts/deploy.sh sets the evaluator's registry and the git SHA tag in a generated
# overlay (.deploy/). So `kubectl apply -k k8s/` alone cannot pull the app images.

# Non-secret settings shared by poll, worker, result and postgres.
# Kustomize appends a content hash to the name and rewrites references,
# so changing a value rolls the Deployments that use it.
configMapGenerator:
  - name: app-config
    literals:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
  # schema.sql, run by the postgres image on its first start (empty data dir only).
  # Copy of poll-application/schema.sql: Kustomize cannot read files outside k8s/; CI checks they match.
  - name: postgres-init
    files:
      - schema.sql

# Passwords, read from the gitignored secrets.env (template: secrets.env.example).
# Same hash suffix as above: changing a password rolls the Deployments.
# Build fails if secrets.env is missing, so nothing deploys without secrets.
secretGenerator:
  - name: app-secrets
    envs:
      - secrets.env
