# Poll: Flask / Gunicorn voting front end pushing votes to the Redis queue.
# Public entry point: Azure gives this Service its own public IP (EXTERNAL-IP).
apiVersion: v1
kind: Service
metadata:
  name: poll
  labels:
    app.kubernetes.io/name: poll
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: poll
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poll
  labels:
    app.kubernetes.io/name: poll
spec:
  # No `replicas`: the HPA in hpa.yaml sets it (2 to 6). A value here would reset it on every apply.
  # Zero-downtime rollout: start one new pod, wait until it is Ready for 5 s, then stop an old one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: poll
  template:
    metadata:
      labels:
        app.kubernetes.io/name: poll
    spec:
      # None of our pods calls the Kubernetes API: no service account token in the containers.
      automountServiceAccountToken: false
      securityContext:
        # Required by the "restricted" Pod Security Standard (namespace.yaml): the runtime's default syscall filter.
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        sysctls:
          # Lets the non-root user (uid 10001 in the image) listen on port 80.
          - name: net.ipv4.ip_unprivileged_port_start
            value: '0'
      # preStop (5 s) + Gunicorn's graceful shutdown (up to 30 s by default), with margin.
      terminationGracePeriodSeconds: 45
      # Prefer one replica per node, so a node failure or drain never takes both down.
      # "Preferred", not "required": during a rollout the surge pod (3rd) must still schedule on 2 nodes.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                # Only count pods of the same version: during a rollout, old pods on every node
                # would otherwise cancel the preference and new pods could pile up on one node.
                matchLabelKeys: ['pod-template-hash']
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: poll
      containers:
        - name: poll
          # Registry and tag are set at deploy time by scripts/deploy.sh.
          image: poll
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: HOME
              value: /tmp
            # The image starts 2 sync workers: one stalled connection blocks a whole worker, and
            # measured ~3.5% of requests timed out. With threads, Gunicorn switches to gthread
            # (2 workers x 4 threads). Read from the env, so the provided Dockerfile stays untouched.
            - name: GUNICORN_CMD_ARGS
              value: '--threads 4'
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
                  optional: true
          # Liveness: the process answers. Readiness: it also reaches Redis.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # On shutdown, keep serving 5 s while the pod is removed from the Service endpoints
          # on every node; only then does the container receive SIGTERM.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            # Gunicorn creates a worker heartbeat file (wgunicorn-*) in /tmp at startup.
            - name: tmp
              mountPath: /tmp
      volumes:
        # In memory (tmpfs), as the Gunicorn FAQ advises for the heartbeat files; counts toward the memory limit.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
