# Result: Node.js front end showing the vote counts, read from PostgreSQL.
# Public entry point: Azure gives this Service its own public IP (EXTERNAL-IP).
# Layer 4 (TCP) load balancing, so the WebSocket used for live scores passes through as is.
apiVersion: v1
kind: Service
metadata:
  name: result
  labels:
    app.kubernetes.io/name: result
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: result
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    app.kubernetes.io/name: result
spec:
  replicas: 2
  # Zero-downtime rollout: start one new pod, wait until it is Ready for 5 s, then stop an old one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  # A rollout with no new Ready pod for 2 min fails (ProgressDeadlineExceeded) instead of waiting
  # 10 min; the old pods keep serving meanwhile. Pods start in 1 to 13 s, plus up to ~20 s of image pull.
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: result
  template:
    metadata:
      labels:
        app.kubernetes.io/name: result
    spec:
      # None of our pods calls the Kubernetes API: no service account token in the containers.
      automountServiceAccountToken: false
      securityContext:
        # Required by the "restricted" Pod Security Standard (namespace.yaml): the runtime's default syscall filter.
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        sysctls:
          # Lets the non-root user (uid 1000 in the image) listen on port 80.
          - name: net.ipv4.ip_unprivileged_port_start
            value: '0'
      # preStop (5 s) + Result's own drain on SIGTERM (at most 10 s, see server.js), with margin.
      terminationGracePeriodSeconds: 30
      # Prefer one replica per node, so a node failure or drain never takes both down.
      # "Preferred", not "required": during a rollout the surge pod (3rd) must still schedule on 2 nodes.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                # Only count pods of the same version: during a rollout, old pods on every node
                # would otherwise cancel the preference and new pods could pile up on one node.
                matchLabelKeys: ['pod-template-hash']
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: result
      containers:
        - name: result
          # Registry and tag are set at deploy time by scripts/deploy.sh.
          image: result
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: app-config
          env:
            # Read-only database user (k8s/users.sh). Overrides POSTGRES_USER from app-config.
            - name: POSTGRES_USER
              value: result_reader
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RESULT_DB_PASSWORD
          # Liveness: the process answers. Readiness: it reached PostgreSQL once since it started.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # On shutdown, keep serving 5 s while the pod is removed from the Service endpoints
          # on every node; only then does the container receive SIGTERM.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
