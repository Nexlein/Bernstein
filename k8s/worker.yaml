# Worker: Java background process consuming votes from Redis and storing them in PostgreSQL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 1
  # Zero-downtime rollout: start the new pod, wait until it is Ready for 5 s, then stop the old one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  # A rollout with no new Ready pod for 2 min fails (ProgressDeadlineExceeded) instead of waiting
  # 10 min; the old pods keep serving meanwhile. Pods start in 1 to 13 s, plus up to ~20 s of image pull.
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      # None of our pods calls the Kubernetes API: no service account token in the containers.
      automountServiceAccountToken: false
      securityContext:
        # Required by the "restricted" Pod Security Standard (namespace.yaml): the runtime's default syscall filter.
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        sysctls:
          # Lets the non-root user (uid 10001 in the image) listen on port 80 for health probes.
          - name: net.ipv4.ip_unprivileged_port_start
            value: '0'
      containers:
        - name: worker
          # Registry and tag are set at deploy time by scripts/deploy.sh.
          image: worker
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
                  optional: true
          # Both probes use /readyz (Redis PING + PostgreSQL isValid). The worker only notices a dead
          # DB connection when it writes; liveness on /readyz restarts it after ~1 min instead, so it
          # reconnects by itself. Safe: it has no Service and no users. Initial delay covers first start.
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
