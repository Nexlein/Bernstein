apiVersion: v1
kind: Namespace
metadata:
  name: bernstein
  # Pod Security Admission: the API server refuses any pod that breaks the "restricted" standard
  # (root, privilege escalation, extra capabilities, no seccomp profile, host access).
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
