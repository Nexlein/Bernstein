# Pod traffic in the namespace: everything is denied, then only the app's own flows are allowed:
#   internet -> poll:80 -> redis:6379 <- worker -> postgres:5432 <- result:80 <- internet
# Enforced only if the cluster runs a network policy engine (Cilium on bernstein-aks, ADR 0025);
# without one, these objects are accepted and ignored.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Every pod may resolve Service names (redis, postgres) through the cluster DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: poll
  labels:
    app.kubernetes.io/name: poll
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: poll
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # No "from": the public LoadBalancer traffic reaches the pod from any client or node.
    - ports:
        - port: 80
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: result
  labels:
    app.kubernetes.io/name: result
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: result
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 80
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
          protocol: TCP
---
# No ingress rule: the worker serves only its probes, which the kubelet sends from the node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: poll
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: worker
      ports:
        - port: 6379
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: result
      ports:
        - port: 5432
          protocol: TCP
